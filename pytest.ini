[pytest]
addopts = -ra --strict-markers
python_files = test_*.py
python_functions = test_*
testpaths = tests
markers =
    unit: fast tests that require no external services
    ui: browser UI tests
    api: backend API tests
    integration: API + UI integration tests
    live: requires a configured WorkFlow Pro environment
    browserstack: intended for BrowserStack execution
    security: tenant isolation / authorization checks
